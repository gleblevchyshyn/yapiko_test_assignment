[project]
name = "yapiko-test-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gudleifr", email = "gleblevchyshyn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "instructor>=1.17.0",
    "openai>=3.3.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
yapiko-test-assignment = "yapiko_test_assignment:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.mypy]
plugins = ["pydantic.mypy"]